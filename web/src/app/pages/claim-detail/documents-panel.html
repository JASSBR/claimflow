<section class="card" aria-labelledby="documents-title">
  <div class="card-title">
    <h2 id="documents-title">
      <app-icon name="file" /> <span i18n="@@documents.title">Pièces justificatives</span>
    </h2>
    <span class="chip"
      >{{ documents().length
      }}{{ settings() ? ' / ' + settings()!.maxDocumentsPerClaim : '' }}</span
    >
  </div>

  @if (documents().length > 0) {
    <ul class="documents">
      @for (document of documents(); track document.id) {
        <li>
          <button
            type="button"
            class="document"
            (click)="open(document)"
            [title]="'SHA-256 ' + document.sha256"
          >
            <span class="file-icon" [class.pdf]="document.contentType === 'application/pdf'">
              <app-icon [name]="document.contentType === 'application/pdf' ? 'file' : 'image'" />
            </span>
            <span class="meta">
              <strong>{{ document.fileName }}</strong>
              <small i18n="@@documents.meta"
                >{{ document.sizeBytes / 1024 | number: '1.0-0' }} Ko · {{ document.uploadedBy }} ·
                {{ document.uploadedAt | date: 'short' }}</small
              >
            </span>
            <app-icon name="external" [size]="15" class="open" />
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="muted empty" i18n="@@documents.empty">Aucune pièce pour l'instant.</p>
  }

  @if (canUpload()) {
    <label
      class="dropzone"
      [class.dragging]="dragging()"
      (dragover)="$event.preventDefault(); dragging.set(true)"
      (dragleave)="dragging.set(false)"
      (drop)="onDrop($event)"
    >
      <input
        type="file"
        class="sr-only"
        accept="application/pdf,image/png,image/jpeg"
        multiple
        (change)="onPick($event)"
      />
      @if (uploading() > 0) {
        <span class="spinner" aria-hidden="true"></span>
        <span i18n="@@documents.uploading">Envoi en cours…</span>
      } @else {
        <app-icon name="upload" />
        <span i18n="@@documents.drop"
          ><strong>Déposez des fichiers</strong> ou cliquez pour parcourir</span
        >
        <small i18n="@@documents.limits"
          >PDF, PNG, JPEG · 10 Mo max · format vérifié à la réception</small
        >
      }
    </label>
  }
</section>
