name: Images

# Builds the API image on GitHub's amd64 runners and publishes it to GitHub Container Registry, tagged with the
# commit: deploy/azure.sh then only points Azure at a tag that already exists.
on:
  # Every commit on main gets its images (unchanged layers come from the cache), so any commit can be deployed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: claimflow-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jassbr/claimflow-api:sha-${{ steps.tag.outputs.short }}
            ghcr.io/jassbr/claimflow-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
