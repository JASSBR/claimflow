name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ClaimFlow.slnx
      - name: Build (analyzers on, warnings are errors)
        run: dotnet build ClaimFlow.slnx -c Release --no-restore
      - name: Format check
        run: dotnet format ClaimFlow.slnx --verify-no-changes --no-restore
      - name: Test (unit + architecture + integration on real PostgreSQL via Testcontainers)
        run: dotnet test --solution ClaimFlow.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Coverage gate (≥ 80 % of production lines)
        run: python3 eng/coverage-gate.py 80
      - name: Vulnerable dependencies
        run: |
          dotnet list ClaimFlow.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - name: EF Core migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project src/Modules/Claims/ClaimFlow.Claims --startup-project src/Modules/Claims/ClaimFlow.Claims --self-contained -r linux-x64 -o efbundle --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end · Playwright on the full stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: claimflow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__claimflow: Host=localhost;Database=claimflow;Username=postgres;Password=ci
      # Azurite's published well-known development key, not a secret.
      ConnectionStrings__blobs: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      Auth__Mode: Demo
      Auth__DemoSigningKey: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-signing-key
      RateLimiting__PermitPerMinute: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start API (migrates and seeds)
        run: |
          dotnet run --project src/ClaimFlow.Api --urls http://localhost:5180 > api.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:5180/alive; do sleep 2; done'
      - name: Start Angular dev server
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm start > ../web.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:4200/api/auth/personas; do sleep 2; done'
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            api.log
            web.log

  docker:
    name: API container image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: claimflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
